    <style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {

}

.hint { font-weight: 400; color: var(--muted); font-size: 12px; }

input, select, textarea { font: inherit; transition: border-color 0.12s; }

select:not([multiple]) {

  padding-right: 34px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 19px) 55%, calc(100% - 14px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
input[type="checkbox"] {
  -webkit-appearance: none;
  appearance: none;
  flex: none;
  width: 18px;
  height: 18px;
  margin: 0 6px 0 0;
  padding: 0;
  vertical-align: -4px;
  border: 1px solid #666;
  border-radius: 6px;
  background: var(--panel);
  cursor: pointer;
}
input[type="checkbox"]:hover { border-color: var(--text); }
input[type="checkbox"]:checked {
  border-color: var(--red-deep);

}

button {
  font: inherit;
  color: var(--text);
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 16px 8px;

button.primary { width: 100%; margin-top: 20px; font-size: 16px; }
button.plain { width: auto; margin: 0; padding: 4px 14px 5px; font-size: 13px; }

  height: 17px;

      <script id="theme-toggle-js">
"use strict";
(function () {
  const root = document.documentElement;
  const read = () => { try { return localStorage.getItem("theme"); } catch (e) { return null; } };
  const write = value => { try { localStorage.setItem("theme", value); } catch (e) {} };

  let theme = read() === "dark" ? "dark" : "light";

  const apply = () => {
    root.classList.remove("light", "dark");
    root.classList.add(theme);
  };
  const label = () => {
    const next = theme === "dark" ? "light" : "dark";
    for (const button of document.querySelectorAll(".theme-toggle")) {
      button.setAttribute("aria-label", `Switch to ${next} mode`);
      button.setAttribute("title", `Switch to ${next} mode`);
    }
  };
  apply();

  document.addEventListener("click", event => {
    if (!event.target.closest || !event.target.closest(".theme-toggle")) return;
    theme = theme === "dark" ? "light" : "dark";
    write(theme);
    apply();
    label();
  });

  const ready = () => {
    for (const button of document.querySelectorAll(".theme-toggle")) button.removeAttribute("onclick");
    label();
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ready);
  else ready();
})();
    </script>

        [1, "tiger", "Tiger"], [18, "seal", "Seal"], [5, "koala", "Koala"],
        [6, "panda", "Panda"], [24, "penguin", "Penguin"], [7, "monkey", "Monkey"],
      ];

      const MESSAGES = {
        invalid_username: "Usernames are 3 to 20 letters, digits, spaces, dots or dashes, with at least three letters.",
        username_taken: "That username is already taken.",
        name_not_allowed: "That username is not allowed.",
        invalid_password: "Passwords need 10 characters or more, with a capital letter, a small letter and a digit.",
        weak_password: "That password is too easy to guess: it has your username in it.",
        choose_animal: "Choose an animal first.",
        too_many_registrations: "Too many accounts were created from your address. Try again in an hour.",
        address_banned: "Your address is banned.",
        agree_first: "Tick the box to agree first.",
        captcha_required: "Complete the captcha.",
        captcha_failed: "Captcha failed. Try again.",
        captcha_unavailable: "Captcha unavailable. Try again later.",
        invalid_email: "Enter a valid recovery email address.",
        invalid_invite: "That invite code is not valid. It may be mistyped, already used, or expired.",
        too_many_invite_attempts: "Too many wrong invite codes. Try again in a few minutes.",
        server_full: "The server is full right now.",
      };

      const $ = id => document.getElementById(id);
      const form = $("form");
      const check = window.captcha.mount($("captcha"), "signup");
      let chosen = null; // [id, file name, name]

      const setStatus = (text, bad) => {
        $("status").textContent = text;
        $("status").classList.toggle("bad", bad);
      };

      // does this server want an invite code, and is there room? the server
      // checks both again at sign-up; this only decides what the page shows.
      fetch("/api/status").then(response => response.json()).then(info => {
        $("invite-row").hidden = !info.inviteRequired;
        form.invite.required = Boolean(info.inviteRequired);
        if (info.full) {
          setStatus(MESSAGES.server_full, true);
        }
      }).catch(() => {});

      const showStep = name => {
        for (const step of ["animal", "account", "done"]) {
          $(`step-${step}`).hidden = step !== name;
        }
        $("card").classList.toggle("narrow", name !== "animal");
        setStatus("", false);
      };

      const choose = animal => {
        chosen = animal;
        for (const button of $("animals").children) {
          const picked = button.dataset.id === String(animal[0]);
          button.setAttribute("aria-checked", String(picked));
          button.tabIndex = picked ? 0 : -1;
        }
        $("stage-empty").hidden = true;
        $("stage-art").src = `/signup/hero_${animal[1]}.svg`;
        $("stage-art").alt = animal[2];
        $("stage-art").hidden = false;
        $("stage-name").textContent = animal[2];
        $("stage-name").hidden = false;
        $("next").disabled = false;
      };

      ANIMALS.forEach((animal, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "animal";
        button.dataset.id = animal[0];
        button.setAttribute("role", "radio");
        button.setAttribute("aria-checked", "false");
        button.tabIndex = index === 0 ? 0 : -1;
        const picture = document.createElement("img");
        picture.src = `/signup/thumb_${animal[1]}.svg`;
        picture.alt = "";
        const name = document.createElement("span");
        name.textContent = animal[2];
        button.append(picture, name);
        button.addEventListener("click", () => choose(animal));
        $("animals").append(button);
      });

      $("animals").addEventListener("keydown", event => {
        const step = {ArrowRight: 1, ArrowDown: 3, ArrowLeft: -1, ArrowUp: -3}[event.key];
        const buttons = [...$("animals").children];
        const at = buttons.indexOf(document.activeElement);
        if (step === undefined || at === -1) {
          return;
        }
        event.preventDefault();
        const to = (at + step + buttons.length) % buttons.length;
        buttons[to].focus();
        choose(ANIMALS[to]);
      });

      $("next").addEventListener("click", () => {
        $("picked-art").src = `/signup/thumb_${chosen[1]}.svg`;
        $("picked-name").textContent = `Starting as a ${chosen[2].toLowerCase()}`;
        showStep("account");
        form.username.focus();
      });

      $("back").addEventListener("click", () => showStep("animal"));

      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (form.password.value !== form.confirm.value) {
          setStatus("The two passwords do not match.", true);
          return;
        }
        // the same rules the server applies (lib/accounts.js passwordProblem), so a
        // refusal shows at once; the server still checks, and also knows the common words
        const typed = form.password.value;
        if (typed.length < 10 || typed.length > 100 || !/[A-Z]/.test(typed) || !/[a-z]/.test(typed) || !/[0-9]/.test(typed)) {
          setStatus(MESSAGES.invalid_password, true);
          return;
        }
        const nameKey = form.username.value.toLowerCase().replace(/[^a-z0-9]/g, "");
        if (nameKey.length >= 3 && typed.toLowerCase().replace(/[^a-z0-9]/g, "").includes(nameKey)) {
          setStatus(MESSAGES.weak_password, true);
          return;
        }
        $("submit").disabled = true;
        try {
          const answer = await check.answer();
          if (answer === "") {
            setStatus(window.captcha.FAILED, true);
            $("submit").disabled = false;
            return;
          }
          const response = await fetch("/api/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({username: form.username.value, password: form.password.value, email: form.email.value, avatarType: chosen[0], agreed: form.agreed.checked,
              invite: form.invite.value, captcha: answer}),
          });
          check.reset();
          const body = await response.json();
          if (response.ok) {
            $("done-name").textContent = body.username;
            form.reset();
            showStep("done");
          }
          else {
            setStatus(MESSAGES[body.error] || "Could not create the account.", true);
          }
        }
        catch (err) {
          setStatus("The server did not answer.", true);
        }
        $("submit").disabled = false;
      });
    </script>
</body>
</html>
